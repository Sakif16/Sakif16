name: refresh-profile-telemetry

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow requests

      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ secrets.PROFILE_GH_TOKEN }}
          USERNAME: Sakif16
        run: python scripts/fetch_contributions.py

      - name: Render ASCII telemetry GIF
        run: python scripts/generate_telemetry.py

      - name: Commit refreshed telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/telemetry.gif
          git diff --cached --quiet || git commit -m "chore: refresh profile telemetry"
          git push
