.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.4s ease both .4s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.webDraw{stroke-dasharray:352;animation:webDraw 1.8s ease both .8s}
@keyframes webDraw{from{stroke-dashoffset:352}to{stroke-dashoffset:0}}
.webFill{animation:webFill 1.8s ease both .8s}
@keyframes webFill{from{opacity:0}to{opacity:1}}
